site_name: RLM-RAG Documentation
site_description: Recursive Language Model Filesystem RAG for large document corpora
site_author: Fabrizio Amort
repo_url: https://github.com/fabrizioamort/RLM-RAG
repo_name: fabrizioamort/RLM-RAG

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Architecture: architecture.md
  - API Reference:
    - RLMFilesystemRAG: api/rlm-filesystem-rag.md
    - RLMConfig: api/rlm-config.md
    - BaseRAG: api/base-rag.md
    - Exceptions: api/exceptions.md
  - Integration:
    - RAG Evaluator: integration/rag-evaluator.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fabrizioamort
